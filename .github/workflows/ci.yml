name: CI

on:
  push:

permissions:
  contents: read

# Naming the shell turns on pipefail, so a failure in a pipeline fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lints what ships (Bash) and type-checks the tests.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      # The runner image ships shellcheck.
      - run: >-
          find bin cli server actions test/*.sh test/fakes test/support test/server-setup -type f
          ! -name '*.yml' ! -name '*.ts' ! -name '*.hujson' -print0 | xargs -0 shellcheck
      # The workflows, the composite actions written out as workflows, and the starter workflows
      # as `deadlift init` writes them.
      - run: test/actionlint.sh

  # The delivery tests: deliveries end to end, through the deliver client script, the entry
  # command and the installed deploy script, against this runner's Docker.
  delivery-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The server-setup tests: bootstrap this runner into a Server, for real, with only tailscale
  # faked. Then the delivery tests run on that Server, which proves the firewall and userns-remap
  # hold for an App's containers.
  server-setup-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:server-setup
      - name: The delivery tests on the bootstrapped Server
        run: pnpm test
        env:
          DEADLIFT_TEST_BOOTSTRAPPED: "true"
